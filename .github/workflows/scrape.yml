name: scrape-rosters

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Seasons: "all" (2018-2026), a single year ("2026"), or comma list ("2018,2019,2024")'
        required: true
        default: 'all'
      teams:
        description: 'Optional: specific teams (canonical name, space-separated). Leave blank for all FBS.'
        required: false
        default: ''
      skip_profiles:
        description: 'Skip per-player profile enrichment (much faster, no transfer/HS fields)'
        required: false
        default: 'false'
      profile_concurrency:
        description: 'Concurrent profile fetches per team-season (default 6)'
        required: false
        default: '6'
      force:
        description: 'Force re-scrape (ignore existing checkpoints)'
        required: false
        default: 'false'

concurrency:
  group: scrape-rosters-${{ github.event.inputs.seasons }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build season matrix
        id: build
        run: |
          INPUT="${{ github.event.inputs.seasons }}"
          if [ "$INPUT" = "all" ]; then
            SEASONS="2018 2019 2020 2021 2022 2023 2024 2025 2026"
          else
            SEASONS=$(echo "$INPUT" | tr ',' ' ')
          fi
          JSON=$(echo "$SEASONS" | xargs -n1 | jq -R . | jq -sc .)
          echo "Resolved seasons: $JSON"
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"

  scrape:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        season: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install openpyxl

      - name: Install Playwright + Chromium
        run: |
          playwright install --with-deps chromium

      - name: Restore checkpoints cache
        uses: actions/cache@v4
        id: ckpt-cache
        with:
          path: checkpoints/
          key: checkpoints-${{ matrix.season }}-${{ hashFiles('team_urls.py', 'scrape_rosters.py') }}-${{ github.run_id }}
          restore-keys: |
            checkpoints-${{ matrix.season }}-${{ hashFiles('team_urls.py', 'scrape_rosters.py') }}-
            checkpoints-${{ matrix.season }}-

      - name: Run scraper for season ${{ matrix.season }}
        env:
          SEASON:              ${{ matrix.season }}
          TEAMS:               ${{ github.event.inputs.teams }}
          SKIP_PROFILES:       ${{ github.event.inputs.skip_profiles }}
          PROFILE_CONCURRENCY: ${{ github.event.inputs.profile_concurrency }}
          FORCE:               ${{ github.event.inputs.force }}
        run: |
          ARGS="--seasons $SEASON --output roster_${SEASON}.csv"
          ARGS="$ARGS --profile-concurrency ${PROFILE_CONCURRENCY:-6}"
          if [ -n "$TEAMS" ]; then ARGS="$ARGS --teams $TEAMS"; fi
          if [ "$SKIP_PROFILES" = "true" ]; then ARGS="$ARGS --skip-profiles"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "Running: python scrape_rosters.py $ARGS"
          python scrape_rosters.py $ARGS 2>&1 | tee scrape_${SEASON}.log

      - name: Save checkpoints cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: checkpoints/
          key: checkpoints-${{ matrix.season }}-${{ hashFiles('team_urls.py', 'scrape_rosters.py') }}-${{ github.run_id }}

      - name: Upload per-season CSV (intermediate)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: per-season-${{ matrix.season }}
          path: |
            roster_${{ matrix.season }}.csv
            scrape_${{ matrix.season }}.log
            checkpoints/${{ matrix.season }}/*_debug.html
          retention-days: 7

  combine:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pandas openpyxl

      - name: Download all per-season artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: per-season-*
          path: per_season/
          merge-multiple: true

      - name: Combine into single roster_full.xlsx (one sheet)
        run: |
          python - <<'PY'
          import glob, pandas as pd, os, datetime
          files = sorted(glob.glob('per_season/roster_*.csv'))
          if not files:
              print("No per-season CSVs found — nothing to combine.")
              raise SystemExit(0)
          dfs = []
          for f in files:
              try:
                  df = pd.read_csv(f)
                  print(f"  {f}: {len(df):,} rows")
                  dfs.append(df)
              except Exception as e:
                  print(f"  WARN: could not read {f}: {e}")
          if dfs:
              full = pd.concat(dfs, ignore_index=True)
              ts = datetime.datetime.utcnow().strftime('%Y%m%dT%H%M%S')
              xlsx_path = f'roster_full_{ts}.xlsx'
              csv_path  = f'roster_full_{ts}.csv'
              # Real xlsx, single sheet 'Players'
              with pd.ExcelWriter(xlsx_path, engine='openpyxl') as w:
                  full.to_excel(w, sheet_name='Players', index=False)
              # Also CSV for downstream tooling
              full.to_csv(csv_path, index=False)
              print(f"\nWrote {xlsx_path}: {len(full):,} rows  "
                    f"({full['season'].nunique()} seasons, "
                    f"{full['team'].nunique()} teams)")
          PY

      - name: Upload combined roster (single artifact, single sheet xlsx)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roster_full
          path: |
            roster_full_*.xlsx
            roster_full_*.csv
          retention-days: 90
